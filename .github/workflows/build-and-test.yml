name: Build and Test

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [RelWithDebInfo]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # zlib and OpenSSL are needed by libcmutils, the rest are the client
    # libraries of the DBMS modules enabled below.
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake \
          zlib1g-dev libssl-dev \
          libmariadb-dev libpq-dev unixodbc-dev libsqlite3-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install mariadb-connector-c libpq unixodbc sqlite openssl@3
        echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -DSUPPORT_MARIA=ON
        -DSUPPORT_PGSQL=ON
        -DSUPPORT_SQLITE=ON
        -DSUPPORT_ODBC=ON
        ${{ runner.os == 'macOS' && '-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR' || '' }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    # only the tests of this project: the libcmutils submodule is covered
    # by its own workflow, and some of its tests need the network.
    - name: Test
      run: >
        ctest --test-dir build -C ${{ matrix.build_type }}
        -R cmdbm_ --output-on-failure

    - name: Verify the shared library links its client libraries (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        ldd build/libcmdbm.so | tee /dev/stderr | \
          grep -q libpq || { echo "libpq is not a recorded dependency"; exit 1; }
